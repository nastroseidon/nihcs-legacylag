<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dr. Wayne — character rig test</title>
<style>
  html,body{margin:0;background:#20160c;height:100%;overflow:hidden;font:13px monospace;color:#eee;}
  canvas{display:block;}
  #info{position:fixed;top:6px;left:8px;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:4px;white-space:pre;}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="info"></div>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module">
import * as THREE from './lib/three.module.js';
import { GLTFLoader } from './lib/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1); renderer.setSize(1280, 720, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6a4a33);
const camera = new THREE.PerspectiveCamera(32, 16/9, 0.1, 100);

scene.add(new THREE.AmbientLight(0x8899cc, 0.6));
const key = new THREE.DirectionalLight(0xffd9a0, 2.6);
key.position.set(-4, 6, 6); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight(0xffc07a, 1.2); rim.position.set(5, 3, -4); scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x9a7b52 }));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

// grid posts every 0.5u for height reference
for (let i = 0; i <= 4; i++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.02, 4),
    new THREE.MeshBasicMaterial({ color: i % 2 ? 0x445566 : 0x667788 }));
  m.position.set(-1.2, i * 0.5, 0); scene.add(m);
}

if (location.search.includes('raw')) globalThis.__NO_TRIM = true;
const { createPlayerVisual } = await import('./src/character.js');
const vis = await createPlayerVisual(scene);

// fake engine state
const S = {
  tick: 0, lives: 3, status: 'playing',
  player: { x: 80, y: 568, w: 46, h: 72, vx: 0, vy: 0, onGround: true, face: 1, invuln: 0, anim: 'idle' },
};

let mode = { clip: null, frozenT: null };
const info = document.getElementById('info');

function frame(dt) {
  S.tick++;
  vis.update(S, dt);
  if (mode.clip && mode.frozenT !== null) {
    const a = vis._debug.actions[mode.clip];
    if (a) { a.time = mode.frozenT; vis._debug.mixer.update(0); }
  }
  // frame the character
  const p = vis.group.position;
  camera.position.set(p.x + 2.4, p.y + 1.05, 3.4);
  camera.lookAt(p.x, p.y + 0.85, 0);
  renderer.render(scene, camera);
  const a = mode.clip && vis._debug.actions[mode.clip];
  info.textContent = `clip=${mode.clip || S.player.anim}  t=${a ? a.time.toFixed(2) : '-'}  dur=${a ? a.getClip().duration.toFixed(2) : '-'}`;
}
frame(0.016);

// ---- test hooks ----
window.__w = {
  vis, S, scene, camera, renderer,
  clips: () => Object.fromEntries(Object.entries(vis._debug.actions)
    .map(([k, a]) => [k, +a.getClip().duration.toFixed(2)])),
  // freeze a clip at time t and render
  pose(clip, t) {
    for (const k in vis._debug.actions) { const a = vis._debug.actions[k]; a.stop(); a.enabled = false; }
    const a = vis._debug.actions[clip];
    a.reset(); a.enabled = true; a.setEffectiveWeight(1); a.play(); a.paused = true; a.time = t;
    mode = { clip, frozenT: t };
    vis._debug.mixer.update(0);
    frame(0);
    return { clip, t, dur: a.getClip().duration };
  },
  setAnim(n) { S.player.anim = n; mode = { clip: null, frozenT: null }; frame(0.016); },
  step(n, dt) { mode = { clip: mode.clip, frozenT: null }; for (let i = 0; i < (n||1); i++) frame(dt || 1/60); },
  face(f) { S.player.face = f; for (let i=0;i<30;i++) frame(1/60); },
  render: () => frame(0.016),
  // Render `n` evenly-spaced frames of a clip into one labelled grid so a
  // single screenshot shows the whole take. Used to pick trim windows.
  sheet(clip, n = 12, cols = 6, from = 0, to = null) {
    const a = vis._debug.actions[clip];
    const dur = to == null ? a.getClip().duration : to;
    const rows = Math.ceil(n / cols);
    const tw = 300, th = 340;
    const out = document.createElement('canvas');
    out.width = cols * tw; out.height = rows * th;
    const g = out.getContext('2d');
    g.fillStyle = '#181008'; g.fillRect(0, 0, out.width, out.height);
    for (let i = 0; i < n; i++) {
      const t = from + (dur - from) * (i / (n - 1 || 1));
      this.pose(clip, Math.min(t, dur - 0.001));
      const col = i % cols, row = (i / cols) | 0;
      g.drawImage(canvas, 250, 20, 780, 700, col * tw, row * th, tw, th - 24);
      g.fillStyle = '#000'; g.fillRect(col * tw, row * th + th - 24, tw, 24);
      g.fillStyle = '#ffd54a'; g.font = 'bold 17px monospace';
      g.fillText(`${clip}  t=${t.toFixed(2)}`, col * tw + 8, row * th + th - 6);
      g.strokeStyle = '#5a4a30'; g.strokeRect(col * tw, row * th, tw, th);
    }
    document.body.innerHTML = '';
    out.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#181008';
    document.body.appendChild(out);
    return `${clip}: ${n} frames over ${dur.toFixed(2)}s`;
  },
};
window.__ready = true;
</script>
</body>
</html>
